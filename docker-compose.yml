services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boardyn
      POSTGRES_PASSWORD: boardyn
      POSTGRES_DB: boardyn
    ports:
      - "5432:5432"
    volumes:
      - boardyn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardyn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  boardyn-pgdata:
